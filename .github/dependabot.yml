version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions-routine:
        patterns: ['*']

  - package-ecosystem: 'bun'
    directories:
      - '/'
      - '/backend'
      - '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'pip'
    directory: '/tagger'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      pip-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'docker'
    directories:
      - '/backend'
      - '/frontend'
      - '/tagger'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    groups:
      docker-routine:
        patterns: ['*']
