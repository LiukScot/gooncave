name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - tests/**
      - playwright.config.ts
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - tests/**
      - playwright.config.ts
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - package-lock.json

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, build, test
    runs-on: ubuntu-latest
    # Hard cap so a hung suite can't burn an hour of runner time.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint backend
        run: npm run lint --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Test backend
        # 3-minute hard ceiling per project mandate. Single shard is plenty;
        # current full suite runs in under 5 seconds. If this ever creeps up,
        # split with `node --test --test-shard=<i>/<n>` across matrix jobs.
        timeout-minutes: 3
        run: npm test --prefix backend

  frontend:
    name: Frontend build, test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        # See backend Test step for the 3-min mandate. Vitest supports
        # --shard if this needs splitting later.
        timeout-minutes: 3
        run: npm test --prefix frontend

  tagger:
    name: Tagger test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tagger/requirements-dev.txt

      - name: Install tagger test deps
        run: pip install -r tagger/requirements-dev.txt

      - name: Run pytest
        timeout-minutes: 3
        working-directory: tagger
        run: pytest -q

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dev deps
        run: npm ci

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        timeout-minutes: 6
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build app image
        run: docker build --file backend/Dockerfile --tag gooncave-app:ci .

      - name: Build tagger image
        run: docker build --file tagger/Dockerfile --tag gooncave-tagger:ci tagger