name: CI

# No workflow-level paths filter: a workflow that never starts leaves its
# required checks "Expected" forever. Jobs skipped by `if` report success.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Release planning tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release scripts
        run: |
          bash -n .github/scripts/release-prs.sh
          bash -n .github/scripts/release-version.sh
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Consumers skip only on an explicit 'false', so a failed or skipped
    # detection runs every check instead of passing them unseen.
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      flatpak: ${{ steps.filter.outputs.flatpak }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - .github/workflows/ci.yml
              - .github/workflows/flatpak.yml
              - frontend/**
              - core/**
              - desktop/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - tests/**
              - playwright.config.ts
              - package.json
              - .husky/**
              - eslint.config.cjs
              - eslint.shared.cjs
              - frontend/eslint.config.cjs
              - package-lock.json
              - frontend/package.json
              - frontend/package-lock.json
            # What can break the Flatpak build. The frontend only gets embedded in it,
            # and the core job already builds the same binary.
            flatpak:
              - .github/workflows/ci.yml
              - .github/workflows/flatpak.yml
              - core/**
              - desktop/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
            # What the iPhone app ships, built on macOS runners only when it changes.
            ios:
              - .github/workflows/ci.yml
              - .github/workflows/ios.yml
              - core/**
              - frontend/**
              - ios/**
              - desktop/icons/app-icon.png
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - package.json

  core:
    name: Rust core tests and desktop build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A static build from GitHub releases: the runner's apt mirror can take 20 minutes.
      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: '8.1'

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test core
        run: cargo test --locked -p gooncave-core

      - name: Check memory of a large backup import
        run: cargo test --locked -p gooncave-core --lib sync::tests::large_import_memory -- --ignored

      - name: Verify WD14 model parity
        run: cargo test --locked -p gooncave-core wd14::tests::matches_python_reference_images -- --ignored

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
            desktop/electron/package-lock.json

      - name: Build frontend
        run: npm ci --prefix frontend && npm run --prefix frontend build

      - name: Build desktop core
        run: cargo build --locked -p gooncave-desktop

      - name: Test desktop core
        run: cargo test --locked -p gooncave-desktop

      - name: Test desktop window
        run: node --test 'desktop/electron/*.test.js'

      - name: Test desktop window in Electron
        run: |
          npm ci
          npm ci --prefix desktop/electron
          # Ubuntu blocks the unprivileged namespaces Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npx playwright test -c desktop/electron/playwright.config.ts

  frontend:
    name: Frontend build, test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dev dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # vite build does not typecheck, so without this the frontend can ship
      # references that do not exist.
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        # 3-minute hard ceiling. Vitest supports --shard if this needs
        # splitting later.
        timeout-minutes: 3
        working-directory: frontend
        run: npm run test

  e2e:
    name: Playwright E2E
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dev deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # A static build from GitHub releases: the runner's apt mirror can take 20 minutes.
      - name: Install FFmpeg for library thumbnails
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: '8.1'

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        # Local runs stay around seconds, but GitHub runners can take much
        # longer once browser startup, image processing, and network-backed
        # booru detection all stack up. Keep this bounded, just not unrealistically tight.
        timeout-minutes: 10
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  flatpak:
    name: Desktop Flatpak
    needs: changes
    # The skip happens inside the called workflow, so a skipped build still reports
    # the required "Desktop Flatpak / Build the Flatpak" check.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/flatpak.yml
    with:
      skip: ${{ needs.changes.outputs.flatpak == 'false' }}
      package: false
      version: pr-${{ github.event.pull_request.number }}

  ios:
    name: iPhone app
    needs: changes
    # The skip happens inside the called workflow, so a skipped build still reports
    # the "iPhone app / Build the IPA" check.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ios.yml
    with:
      skip: ${{ needs.changes.outputs.ios == 'false' }}
      version: pr-${{ github.event.pull_request.number }}
