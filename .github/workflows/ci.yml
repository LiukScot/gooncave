name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - tests/**
      - playwright.config.ts
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - bun.lock
      - .prettierrc.json
      - .prettierignore
      - .husky/**
      - eslint.config.cjs
      - eslint.shared.cjs
      - backend/eslint.config.cjs
      - backend/bun.lock
      - frontend/eslint.config.cjs
      - frontend/bun.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - tests/**
      - playwright.config.ts
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - bun.lock
      - .prettierrc.json
      - .prettierignore
      - .husky/**
      - eslint.config.cjs
      - eslint.shared.cjs
      - backend/eslint.config.cjs
      - backend/bun.lock
      - frontend/eslint.config.cjs
      - frontend/bun.lock

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, build, test
    runs-on: ubuntu-latest
    # Hard cap so a hung suite can't burn an hour of runner time.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11

      - name: Install backend dependencies
        run: bun install --cwd backend --frozen-lockfile

      - name: Lint backend
        working-directory: backend
        run: bun run lint

      - name: Build backend
        working-directory: backend
        run: bun run build

      - name: Test backend
        # 3-minute hard ceiling per project mandate. Single shard is plenty;
        # current full suite runs in under 5 seconds. If this ever creeps up,
        # split with `node --test --test-shard=<i>/<n>` across matrix jobs.
        timeout-minutes: 3
        working-directory: backend
        run: bun run test

  frontend:
    name: Frontend build, test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Test frontend
        # See backend Test step for the 3-min mandate. Vitest supports
        # --shard if this needs splitting later.
        timeout-minutes: 3
        working-directory: frontend
        run: bun run test

  tagger:
    name: Tagger test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tagger/requirements-dev.txt

      - name: Install tagger test deps
        run: pip install -r tagger/requirements-dev.txt

      - name: Run pytest
        timeout-minutes: 3
        working-directory: tagger
        run: pytest -q

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11

      - name: Install root dev deps
        run: bun install --frozen-lockfile

      - name: Install backend deps
        run: bun install --cwd backend --frozen-lockfile

      - name: Install frontend deps
        run: bun install --cwd frontend --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Install Playwright browser (chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        # Local runs stay around seconds, but GitHub runners can take much
        # longer once browser startup, image processing, and network-backed
        # booru detection all stack up. Keep this bounded, just not unrealistically tight.
        timeout-minutes: 10
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build app image
        run: docker build --file backend/Dockerfile --tag gooncave-app:ci .

      - name: Build tagger image
        run: docker build --file tagger/Dockerfile --tag gooncave-tagger:ci tagger
