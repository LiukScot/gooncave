name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - e2e/**
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - e2e/**
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - package-lock.json

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, build, test
    runs-on: ubuntu-latest
    # Hard cap so a hung suite can't burn an hour of runner time.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint backend
        run: npm run lint --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Test backend
        # 3-minute hard ceiling per project mandate. Single shard is plenty;
        # current full suite runs in under 5 seconds. If this ever creeps up,
        # split with `node --test --test-shard=<i>/<n>` across matrix jobs.
        timeout-minutes: 3
        run: npm test --prefix backend

  frontend:
    name: Frontend build, test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        # See backend Test step for the 3-min mandate. Vitest supports
        # --shard if this needs splitting later.
        timeout-minutes: 3
        run: npm test --prefix frontend

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image
        run: docker build --file backend/Dockerfile --tag gooncave-app:ci .

      - name: Build tagger image
        run: docker build --file tagger/Dockerfile --tag gooncave-tagger:ci tagger

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Run on main pushes and on PRs that opt in via the `run-e2e` label.
    # Browser tests are slow; gating them keeps the per-PR feedback loop fast.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    # Hard cap. Stack startup + 3 specs runs in well under this in dry runs.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build app image
        # The e2e suite hits the production image, which is the only place
        # the cookie-Secure regression in #67 is reproducible.
        run: docker build --file backend/Dockerfile --tag gooncave-app:e2e .

      - name: Start api stack
        # Only the api service is needed for auth + cookie + range tests.
        # The worker + tagger services pull a multi-GB ML model and aren't
        # exercised by the current spec set.
        env:
          GOONCAVE_IMAGE: gooncave-app:e2e
        run: |
          set -euo pipefail
          docker run -d \
            --name gooncave-api \
            -p 4100:4100 \
            -e HOST=0.0.0.0 \
            -e PORT=4100 \
            -e NODE_ENV=production \
            -e ALLOWED_ORIGINS=http://localhost:4100 \
            -e AUTH_COOKIE_SECURE=false \
            -e FOLDER_PATHS= \
            "$GOONCAVE_IMAGE"

      - name: Wait for /health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4100/health >/dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 2
          done
          echo "api never became healthy"
          docker logs gooncave-api || true
          exit 1

      - name: Install e2e dependencies
        run: npm ci --prefix e2e

      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Run Playwright tests
        # The whole suite must finish under 3 minutes per project mandate.
        timeout-minutes: 3
        run: npm test --prefix e2e

      - name: Collect api logs on failure
        if: failure()
        run: docker logs gooncave-api || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker rm -f gooncave-api || true