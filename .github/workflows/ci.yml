name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - backend/**
      - frontend/**
      - tagger/**
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - package-lock.json

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, build, test
    runs-on: ubuntu-latest
    # Hard cap so a hung suite can't burn an hour of runner time.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint backend
        run: npm run lint --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Test backend
        # 3-minute hard ceiling per project mandate. Single shard is plenty;
        # current full suite runs in under 5 seconds. If this ever creeps up,
        # split with `node --test --test-shard=<i>/<n>` across matrix jobs.
        timeout-minutes: 3
        run: npm test --prefix backend

  frontend:
    name: Frontend build, test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        # See backend Test step for the 3-min mandate. Vitest supports
        # --shard if this needs splitting later.
        timeout-minutes: 3
        run: npm test --prefix frontend

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image
        run: docker build --file backend/Dockerfile --tag gooncave-app:ci .

      - name: Build tagger image
        run: docker build --file tagger/Dockerfile --tag gooncave-tagger:ci tagger