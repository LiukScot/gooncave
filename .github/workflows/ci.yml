name: CI

# No workflow-level paths filter: a workflow that never starts leaves its
# required checks "Expected" forever. Jobs skipped by `if` report success.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Consumers skip only on an explicit 'false', so a failed or skipped
    # detection runs every check instead of passing them unseen.
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - .github/workflows/ci.yml
              - .github/workflows/flatpak.yml
              - backend/**
              - frontend/**
              - core/**
              - desktop/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - tagger/**
              - tests/**
              - playwright.config.ts
              - package.json
              - bun.lock
              - .husky/**
              - eslint.config.cjs
              - eslint.shared.cjs
              - backend/eslint.config.cjs
              - backend/bun.lock
              - frontend/eslint.config.cjs
              - frontend/bun.lock

  core:
    name: Rust core tests and desktop build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev ffmpeg

      - name: Install Rust toolchain
        run: rustup show

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test core
        run: cargo test --locked -p gooncave-core

      - name: Check memory of a large backup import
        run: cargo test --locked -p gooncave-core --lib sync::tests::large_import_memory -- --ignored

      - name: Verify WD14 model parity
        run: cargo test --locked -p gooncave-core wd14::tests::matches_python_reference_images -- --ignored

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Build frontend
        run: bun install --cwd frontend --frozen-lockfile && bun run --cwd frontend build

      - name: Build desktop shell
        run: cargo build --locked -p gooncave-desktop

      - name: Test desktop lifecycle
        run: cargo test --locked -p gooncave-desktop

  backend:
    name: Backend lint, build, test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    # Hard cap so a hung suite can't burn an hour of runner time.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Root package.json packageManager is the single source of truth for the
      # Bun version. The sub-package.json pins can't reference it (JSON syntax),
      # so fail the build if any drifts out of sync.
      - name: Verify Bun version pins agree
        run: |
          want=$(grep -oP '"packageManager":\s*"bun@\K[^"]+' package.json)
          echo "Canonical Bun version: $want"
          status=0
          for f in backend/package.json frontend/package.json; do
            got=$(grep -oP '"packageManager":\s*"bun@\K[^"]+' "$f")
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::bun@$got does not match canonical $want"
              status=1
            fi
          done
          exit $status

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install root dev dependencies
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        run: bun install --cwd backend --frozen-lockfile

      - name: Lint backend
        working-directory: backend
        run: bun run lint

      - name: Build backend
        working-directory: backend
        run: bun run build

      - name: Test backend
        # 3-minute hard ceiling per project mandate. Single shard is plenty;
        # current full suite runs in under 5 seconds. If this ever creeps up,
        # split with `node --test --test-shard=<i>/<n>` across matrix jobs.
        timeout-minutes: 3
        working-directory: backend
        run: bun run test

  frontend:
    name: Frontend build, test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install root dev dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint

      # vite build does not typecheck, so without this the frontend can ship
      # references that do not exist.
      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Test frontend
        # See backend Test step for the 3-min mandate. Vitest supports
        # --shard if this needs splitting later.
        timeout-minutes: 3
        working-directory: frontend
        run: bun run test

  tagger:
    name: Tagger test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tagger/requirements-dev.txt

      - name: Install tagger test deps
        run: pip install -r tagger/requirements-dev.txt

      - name: Run pytest
        timeout-minutes: 3
        working-directory: tagger
        run: pytest -q

  e2e:
    name: Playwright E2E
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install root dev deps
        run: bun install --frozen-lockfile

      - name: Install backend deps
        run: bun install --cwd backend --frozen-lockfile

      - name: Install frontend deps
        run: bun install --cwd frontend --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Install FFmpeg for library thumbnails
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright browser (chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Run E2E suite
        # Local runs stay around seconds, but GitHub runners can take much
        # longer once browser startup, image processing, and network-backed
        # booru detection all stack up. Keep this bounded, just not unrealistically tight.
        timeout-minutes: 10
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  flatpak:
    name: Desktop Flatpak
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    uses: ./.github/workflows/flatpak.yml
    with:
      version: pr-${{ github.event.pull_request.number }}
