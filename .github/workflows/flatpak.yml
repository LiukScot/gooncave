name: Desktop Flatpak

# Builds the commit of the calling run. CI calls it to check the build; the
# weekly release also packages it as the .flatpak file it attaches.
on:
  workflow_call:
    inputs:
      skip:
        description: Report the build as skipped, for changes that cannot affect it.
        type: boolean
        default: false
      package:
        description: Compress the build into a .flatpak file and upload it, which takes minutes.
        type: boolean
        default: true
      version:
        description: Shared release version, like 1.3.0, or a PR build identifier.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build the Flatpak
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build frontend
        run: npm ci --prefix frontend && npm run --prefix frontend build

      - name: Install Flatpak tools and the SDK
        id: sdk
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --install-deps-only flatpak-build desktop/flatpak/app.gooncave.desktop.yml
          rust=$(flatpak info --user --show-commit org.freedesktop.Sdk.Extension.rust-stable)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

      # The SDK has its own compiler: a new one cannot reuse anything, so it starts a new cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: flatpak-${{ steps.sdk.outputs.rust }}
          cache-targets: false
          cache-directories: ~/.cache/gooncave-flatpak-cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the app
        run: |
          flatpak-builder --subject="GoonCave $VERSION" --user --force-clean \
            --repo=flatpak-repo flatpak-build desktop/flatpak/app.gooncave.desktop.yml

      - name: Package the app
        if: ${{ inputs.package }}
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "GoonCave-linux-x86_64.flatpak" app.gooncave.desktop

      - name: Upload the Flatpak
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gooncave-desktop
          path: GoonCave-linux-x86_64.flatpak
          if-no-files-found: error
