name: Desktop Flatpak

# Builds the desktop app as a .flatpak file. CI calls it to check the build;
# the weekly release calls it to make the file it attaches.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build.
        type: string
        required: true
      version:
        description: Version written in the file name, like 1.0.0.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build the Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Build frontend
        run: bun install --cwd frontend --frozen-lockfile && bun run --cwd frontend build

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the app
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=flatpak-repo flatpak-build desktop/flatpak/app.gooncave.desktop.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "GoonCave-$VERSION-linux-x86_64.flatpak" app.gooncave.desktop

      - name: Upload the Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gooncave-desktop
          path: GoonCave-${{ inputs.version }}-linux-x86_64.flatpak
          if-no-files-found: error
