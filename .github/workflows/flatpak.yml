name: Desktop Flatpak

# Builds the commit of the calling run as a .flatpak file. CI calls it to check
# the build; the weekly release calls it to make the file it attaches.
on:
  workflow_call:
    inputs:
      skip:
        description: Report the build as skipped, for changes that cannot affect it.
        type: boolean
        default: false
      version:
        description: Shared release version, like 1.3.0, or a PR build identifier.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build the Flatpak
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build frontend
        run: npm ci --prefix frontend && npm run --prefix frontend build

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the app
        run: |
          flatpak-builder --subject="GoonCave $VERSION" --user --install-deps-from=flathub --force-clean \
            --repo=flatpak-repo flatpak-build desktop/flatpak/app.gooncave.desktop.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "GoonCave-linux-x86_64.flatpak" app.gooncave.desktop

      - name: Upload the Flatpak
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gooncave-desktop
          path: GoonCave-linux-x86_64.flatpak
          if-no-files-found: error
