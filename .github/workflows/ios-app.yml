name: iOS app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-app.yml
      - ios/GoonCave/**

permissions:
  contents: read

jobs:
  device-build:
    name: Build GoonCave for iPhone
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/GoonCave
        run: |
          xcodegen --version
          xcodegen generate

      - name: Build iPhone app without publisher signing
        working-directory: ios/GoonCave
        run: |
          xcodebuild \
            -project GoonCave.xcodeproj \
            -scheme GoonCave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package device IPA
        working-directory: ios/GoonCave
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/ios/Build/Products/Release-iphoneos/GoonCave.app/Info.plist)
          mkdir -p build/ipa/Payload
          ditto build/ios/Build/Products/Release-iphoneos/GoonCave.app \
            build/ipa/Payload/GoonCave.app
          ditto -c -k --keepParent build/ipa/Payload "build/GoonCave-${version}-ios.ipa"
          python3 scripts/inspect_ipa.py "build/GoonCave-${version}-ios.ipa" \
            --source-sha "$GITHUB_SHA" \
            --xcode "$(xcodebuild -version | paste -sd ' ' -)" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-version)" \
            > build/ipa-metadata.json
          cp ../../LICENSE build/LICENSE
          cat build/ipa-metadata.json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gooncave-iphone
          path: |
            ios/GoonCave/build/GoonCave-*-ios.ipa
            ios/GoonCave/build/ipa-metadata.json
            ios/GoonCave/build/LICENSE
          if-no-files-found: error

  unit-tests:
    name: Test GoonCave on the iOS simulator
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/GoonCave
        run: xcodegen generate

      # Runner images rename simulators between Xcode releases; pick any
      # available iPhone on an iOS 26 runtime instead of hardcoding a model.
      - name: Run unit tests
        working-directory: ios/GoonCave
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, found in sorted(devices.items(), reverse=True)
                     if ".iOS-26" in runtime for d in found if d["name"].startswith("iPhone")))
          ')
          xcodebuild \
            -project GoonCave.xcodeproj \
            -scheme GoonCave \
            -destination "id=$udid" \
            -derivedDataPath build/test \
            test
