name: iPhone app

# Builds the commit of the calling run as an unsigned IPA on hosted macOS. CI
# calls it to check the build; the weekly release calls it to make the file it
# attaches. The owner re-signs the IPA with KravaSign before installing it.
on:
  workflow_call:
    inputs:
      skip:
        description: Report the build as skipped, for changes that cannot affect it.
        type: boolean
        default: false
      upload:
        description: Upload the IPA as an artifact.
        type: boolean
        default: true
      version:
        description: Shared release version, like 1.3.0, or a PR build identifier.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build the IPA
    if: ${{ !inputs.skip }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install toolchain
        run: |
          xcodebuild -version
          rustup target add aarch64-apple-ios
          brew install xcodegen

      # Keeps compiled dependencies between runs; only GoonCave's own crates build again.
      # Only main saves: pull requests read its cache, and cannot read each other's.
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate the Xcode project and icons
        run: |
          npm ci
          npm run tauri -- ios init --ci --skip-targets-install
          npm run tauri -- icon ../desktop/icons/app-icon.png

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Build the unsigned IPA
        run: |
          # A pull request build has no release number. It takes the newest release tag, so
          # installing it over that release is not a downgrade.
          release=''
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release="$VERSION"
          else
            latest=$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}" 'refs/tags/v*' \
              | sed -E 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            release="$latest"
          fi
          bash scripts/build-unsigned-ipa.sh "GoonCave-iphone.ipa" $release

      # Uploaded before the tests so the IPA is ready to install sooner; a failing test still
      # fails the job.
      - name: Upload the IPA
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gooncave-iphone
          path: ios/GoonCave-iphone.ipa
          if-no-files-found: error

      # The IPA build has already built the frontend these tests embed.
      - name: Test the iPhone shell
        run: cargo test --locked -p gooncave-ios
