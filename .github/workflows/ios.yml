name: iPhone app

# Builds the commit of the calling run as an unsigned IPA on hosted macOS. CI
# calls it to check the build; the weekly release calls it to make the file it
# attaches. The owner re-signs the IPA with KravaSign before installing it.
on:
  workflow_call:
    inputs:
      skip:
        description: Report the build as skipped, for changes that cannot affect it.
        type: boolean
        default: false
      skip-tests:
        description: Build the IPA without testing the shell, for changes the tests do not read.
        type: boolean
        default: false
      upload:
        description: Upload the IPA as an artifact.
        type: boolean
        default: true
      version:
        description: Shared release version, like 1.3.0, or a PR build identifier.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build the IPA
    if: ${{ !inputs.skip }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # The frontend is installed by Tauri's beforeBuildCommand, so its lockfile keys the cache too.
          cache: npm
          cache-dependency-path: |
            ios/package-lock.json
            frontend/package-lock.json

      - name: Install toolchain
        run: |
          xcodebuild -version
          rustup target add aarch64-apple-ios
          brew install xcodegen

      # Keeps compiled dependencies between runs; only GoonCave's own crates build again.
      # Only main saves: pull requests read its cache, and cannot read each other's.
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate the Xcode project and icons
        run: |
          npm ci
          npm run tauri -- ios init --ci --skip-targets-install
          npm run tauri -- icon ../desktop/icons/app-icon.png

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Build the unsigned IPA
        run: |
          # Tauri passes Xcode only its own variables, so the core's build identity goes through Cargo's config.
          mkdir -p .cargo
          printf '[env]\nGOONCAVE_VERSION = "%s"\nGOONCAVE_COMMIT = "%s"\n' "$VERSION" "$COMMIT" > .cargo/config.toml
          # A pull request build has no release number. It takes the newest release tag, so
          # installing it over that release is not a downgrade.
          release=''
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release="$VERSION"
          else
            latest=$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}" 'refs/tags/v*' \
              | sed -E 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            release="$latest"
          fi
          bash scripts/build-unsigned-ipa.sh "GoonCave-iphone.ipa" $release

      - name: Upload the IPA
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gooncave-iphone
          path: ios/GoonCave-iphone.ipa
          if-no-files-found: error

  # Runs beside the build so the IPA is ready without waiting for the tests.
  test:
    name: Test the iPhone shell
    if: ${{ !inputs.skip && !inputs.skip-tests }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ios/package-lock.json
            frontend/package-lock.json

      - name: Install toolchain
        run: rustup show

      # Only main saves: pull requests read its cache, and cannot read each other's.
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The shell embeds the built frontend (frontendDist in tauri.conf.json).
      - name: Build frontend
        run: npm ci --prefix frontend && npm run --prefix frontend build

      # tauri-build requires the icons that the build step generates.
      - name: Generate icons
        working-directory: ios
        run: |
          npm ci
          npm run tauri -- icon ../desktop/icons/app-icon.png

      - name: Test the iPhone shell
        run: cargo test --locked -p gooncave-ios

      - name: Lint the iPhone shell
        run: cargo clippy --locked -p gooncave-ios --all-targets -- -D warnings

      # The Core ML package is a release asset that is published separately from the code; until
      # that release exists the check has nothing to read.
      - name: Find the WD14 Core ML release
        id: wd14
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view wd14-coreml-1 --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release wd14-coreml-1 does not exist yet; the WD14 Core ML check was skipped."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Only main saves: each pull request would otherwise store its own 195 MB copy.
      - name: Restore the WD14 Core ML files
        if: steps.wd14.outputs.found == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wd14
          key: wd14-coreml-${{ hashFiles('core/src/wd14_model.rs') }}

      - name: Setup Python
        if: steps.wd14.outputs.found == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Same files, hashes and revision as core/src/wd14_model.rs.
      - name: Check WD14 Core ML against the desktop model
        if: steps.wd14.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WD14: ${{ runner.temp }}/wd14
        run: |
          package="$WD14/WD14.mlpackage"
          mkdir -p "$package/Data/com.apple.CoreML/weights"
          fetch() { [ -f "$2" ] || gh release download wd14-coreml-1 --repo "$REPOSITORY" --pattern "$1" --output "$2"; }
          fetch Manifest.json "$package/Manifest.json"
          fetch model.mlmodel "$package/Data/com.apple.CoreML/model.mlmodel"
          fetch weight.bin "$package/Data/com.apple.CoreML/weights/weight.bin"
          [ -f "$WD14/selected_tags.csv" ] || curl --fail --location --silent --show-error --output "$WD14/selected_tags.csv" \
            https://huggingface.co/SmilingWolf/wd-v1-4-convnextv2-tagger-v2/resolve/dbd4dbe553ee51feb3bc745b614fb762080e3912/selected_tags.csv
          shasum -a 256 -c <<EOF
          2b9b60e521336439d89c75898ebb0912a0d4520cf4f1214fb14a8cca863897ff  $package/Manifest.json
          dc4212b5b365599af17036f94bd82177439755b424e4ca1a9aa61fb56220e1a3  $package/Data/com.apple.CoreML/model.mlmodel
          9c1c13d27757c691c145e4cf64956b45cb8b9008e1e8ec260cf8e996cbd680c5  $package/Data/com.apple.CoreML/weights/weight.bin
          8c8750600db36233a1b274ac88bd46289e588b338218c2e4c62bbc9f2b516368  $WD14/selected_tags.csv
          EOF
          python3 -m pip install --quiet coremltools numpy pillow
          python3 -I ios/wd14/check.py "$package" "$WD14/selected_tags.csv"

      - name: Save the WD14 Core ML files
        if: steps.wd14.outputs.found == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wd14
          key: wd14-coreml-${{ hashFiles('core/src/wd14_model.rs') }}
