name: Release

# Publishes the production images to GHCR on every push to main. The server's
# Watchtower polls them and restarts the containers on its own.
# ponytail: no CI gate here — main is only reached through PRs that CI already
# ran on. Gate with `workflow_run` if direct pushes to main ever start happening.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing image must not block the other from shipping.
      fail-fast: false
      matrix:
        include:
          # The app image runs both `api` and `worker`; they differ only by command.
          - image: gooncave
            context: .
            dockerfile: backend/Dockerfile
          - image: gooncave-tagger
            context: tagger
            dockerfile: tagger/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # :latest is what the server follows; the sha tag is the rollback handle.
          tags: |
            ghcr.io/liukscot/${{ matrix.image }}:latest
            ghcr.io/liukscot/${{ matrix.image }}:${{ github.sha }}
          # Links the package to this repo on GHCR, which is also what makes the
          # package inherit the repo's public visibility.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
