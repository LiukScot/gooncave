name: Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/security.yml
      - backend/**
      - frontend/**
      - tagger/**
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - bun.lock
      - .prettierrc.json
      - .prettierignore
      - .husky/**
      - eslint.config.cjs
      - eslint.shared.cjs
      - backend/eslint.config.cjs
      - backend/bun.lock
      - frontend/eslint.config.cjs
      - frontend/bun.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/security.yml
      - backend/**
      - frontend/**
      - tagger/**
      - docker-compose.yml
      - docker-compose.override.yml.example
      - package.json
      - bun.lock
      - .prettierrc.json
      - .prettierignore
      - .husky/**
      - eslint.config.cjs
      - eslint.shared.cjs
      - backend/eslint.config.cjs
      - backend/bun.lock
      - frontend/eslint.config.cjs
      - frontend/bun.lock
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review (PR delta)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fails the PR only on dependencies the diff introduces or bumps to a
      # vulnerable version. Absolute-state enforcement still happens on push
      # to main and on the nightly schedule.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  bun-audit:
    name: Bun audit (${{ matrix.package_dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_dir: [backend, frontend]
    env:
      AUDIT_LEVEL: high
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --cwd ${{ matrix.package_dir }} --frozen-lockfile

      - name: Audit production dependencies
        working-directory: ${{ matrix.package_dir }}
        run: bun audit --audit-level $AUDIT_LEVEL

  container-scan:
    name: Container scan (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: app
            image_ref: gooncave-app:security
            dockerfile: backend/Dockerfile
            context: .
          - image_name: tagger
            image_ref: gooncave-tagger:security
            dockerfile: tagger/Dockerfile
            context: tagger
    env:
      TRIVY_SEVERITY: HIGH,CRITICAL
      TRIVY_EXIT_CODE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image
        run: docker build --file ${{ matrix.dockerfile }} --tag ${{ matrix.image_ref }} ${{ matrix.context }}

      # Enforced everywhere (PR, main, nightly) so fixable HIGH/CRITICAL image
      # CVEs are caught in the PR. ignore-unfixed keeps ambient base-image
      # noise out until a patched version exists.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image_ref }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
