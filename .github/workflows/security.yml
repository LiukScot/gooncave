name: Security

# No workflow-level paths filter: a workflow that never starts leaves its
# required checks "Expected" forever. Jobs skipped by `if` report success.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Consumers skip only on an explicit 'false', so a failed or skipped
    # detection runs every check instead of passing them unseen.
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - .github/workflows/security.yml
              - backend/**
              - frontend/**
              - tagger/**
              - package.json
              - bun.lock
              - .husky/**
              - eslint.config.cjs
              - eslint.shared.cjs
              - backend/eslint.config.cjs
              - backend/bun.lock
              - frontend/eslint.config.cjs
              - frontend/bun.lock

  dependency-review:
    name: Dependency review (PR delta)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the PR only on dependencies the diff introduces or bumps to a
      # vulnerable version.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  bun-audit:
    name: Bun audit (${{ matrix.package_dir }})
    needs: changes
    if: ${{ !cancelled() }}
    # Gate steps, not the job: a skipped matrix job reports its unexpanded
    # name, so the required per-package checks would never appear.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_dir: [backend, frontend]
    env:
      AUDIT_LEVEL: high
    steps:
      - name: Checkout
        if: needs.changes.outputs.relevant != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        if: needs.changes.outputs.relevant != 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: needs.changes.outputs.relevant != 'false'
        run: bun install --cwd ${{ matrix.package_dir }} --frozen-lockfile

      - name: Audit production dependencies
        if: needs.changes.outputs.relevant != 'false'
        working-directory: ${{ matrix.package_dir }}
        run: bun audit --audit-level $AUDIT_LEVEL
