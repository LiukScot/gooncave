name: WD14 diagnose
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/wd14-diagnose.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        precision: [mixed, fp32]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - env:
          PRECISION: ${{ matrix.precision }}
        run: |
          python3 -m pip install --quiet tensorflow coremltools numpy pillow huggingface_hub
          if [ "$PRECISION" = fp32 ]; then
            sed -i '' 's/compute_precision=.*/compute_precision=ct.precision.FLOAT32,/' ios/wd14/convert.py
          fi
          python3 ios/wd14/convert.py > /dev/null 2>&1
          curl --fail --location --silent --show-error --output selected_tags.csv \
            https://huggingface.co/SmilingWolf/wd-v1-4-convnextv2-tagger-v2/resolve/dbd4dbe553ee51feb3bc745b614fb762080e3912/selected_tags.csv
          shasum -a 256 WD14.mlpackage/Manifest.json WD14.mlpackage/Data/com.apple.CoreML/model.mlmodel WD14.mlpackage/Data/com.apple.CoreML/weights/weight.bin
          python3 -I ios/wd14/check.py WD14.mlpackage selected_tags.csv
