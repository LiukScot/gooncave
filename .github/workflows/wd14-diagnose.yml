name: WD14 diagnose
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/wd14-diagnose.yml]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        extra:
          - 'False'
          - '"/add_" in op.name and op.op_type == "add"'
          - '"_act_" in op.name'
          - '"conv2d_01" in op.name'
          - 'op.op_type not in ("conv", "linear", "matmul")'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python3 -m pip install --quiet tensorflow coremltools numpy pillow huggingface_hub
          python3 - <<'PY'
          import os
          p = "ios/wd14/convert.py"
          s = open(p).read()
          old = 'return op.name not in FP32 and "_grn/" not in op.name'
          assert old in s
          open(p, "w").write(s.replace(old, old + " and not (" + os.environ["EXTRA"] + ")"))
          PY
          grep -n 'return op.name not in FP32' ios/wd14/convert.py
          python3 ios/wd14/convert.py > convert.log 2>&1 || { tail -20 convert.log; exit 1; }
          curl --fail --location --silent --show-error --output selected_tags.csv \
            https://huggingface.co/SmilingWolf/wd-v1-4-convnextv2-tagger-v2/resolve/dbd4dbe553ee51feb3bc745b614fb762080e3912/selected_tags.csv
          du -sh WD14.mlpackage
          python3 -I ios/wd14/check.py WD14.mlpackage selected_tags.csv
