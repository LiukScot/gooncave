name: Weekly release

# Drafts one GitHub Release for the whole project. A platform gets a new
# version when a pull request has changed what it ships since its last
# `<platform>/v*` tag, or when a version is given by hand. The release always
# carries the current file of every platform: the one built here, or the one
# from the latest published release when that platform has nothing new.
# Started once a week by the owner's scheduled agent, or by hand. Nothing is
# public until the owner publishes the draft.
on:
  workflow_dispatch:
    inputs:
      pc_version:
        description: PC version to release, like 1.2.0. Empty picks it from the merged pull requests.
        type: string
        default: ''
      ios_version:
        description: iPhone version to release, like 0.2.0. Empty picks it from the merged pull requests.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  plan:
    name: Pick the versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      FORCED_PC: ${{ inputs.pc_version }}
      FORCED_IOS: ${{ inputs.ios_version }}
    outputs:
      sha: ${{ steps.versions.outputs.sha }}
      release_tag: ${{ steps.versions.outputs.release_tag }}
      pc_new: ${{ steps.versions.outputs.pc_new }}
      pc_previous: ${{ steps.versions.outputs.pc_previous }}
      ios_new: ${{ steps.versions.outputs.ios_new }}
      ios_previous: ${{ steps.versions.outputs.ios_previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Pick the next version of each platform
        id: versions
        run: |
          head=$(git rev-parse HEAD)
          any=''
          for platform in pc ios; do
            previous=$(git tag --list "$platform/v*" | sort -V | tail -n1)
            if [[ -z "$previous" ]]; then
              echo "::error::No $platform/v* tag to count from."
              exit 1
            fi
            if [[ "$platform" == pc ]]; then forced="$FORCED_PC"; else forced="$FORCED_IOS"; fi
            next=''
            if [[ -n "$forced" ]]; then
              if [[ ! "$forced" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::'$forced' is not a version like 1.2.3."
                exit 1
              fi
              if git rev-parse -q --verify "refs/tags/$platform/v$forced" > /dev/null; then
                echo "::error::$platform/v$forced already exists."
                exit 1
              fi
              next="$forced"
            else
              prs=$(.github/scripts/release-prs.sh "$platform" "$previous" "$head")
              if [[ $(jq length <<< "$prs") -gt 0 ]]; then
                # On PC a feature makes a minor release and fixes alone a
                # patch. An iOS minor is a finished roadmap milestone, given
                # by hand, so the automatic choice only advances its patch.
                IFS=. read -r major minor patch <<< "${previous#"$platform"/v}"
                if [[ "$platform" == pc ]] && jq -e 'any(.[]; .labels | index("enhancement") != null)' <<< "$prs" > /dev/null; then
                  minor=$((minor + 1))
                  patch=0
                else
                  patch=$((patch + 1))
                fi
                next="$major.$minor.$patch"
              fi
            fi
            echo "$platform: ${next:-nothing new} (last tag $previous)"
            any+="$next"
            {
              echo "${platform}_new=$next"
              echo "${platform}_previous=$previous"
            } >> "$GITHUB_OUTPUT"
          done
          if [[ -z "$any" ]]; then
            echo "Nothing new on any platform; no release."
            exit 0
          fi
          release_tag="release/$(date -u +%F)"
          if git rev-parse -q --verify "refs/tags/$release_tag" > /dev/null; then
            release_tag+="-$GITHUB_RUN_NUMBER"
          fi
          {
            echo "sha=$head"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  pc:
    name: Build the PC installer
    needs: plan
    if: needs.plan.outputs.pc_new != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packaging/installer/go.mod
          cache: false

      # The installer pins both images by commit. The Release workflow pushes
      # them on every push to main, so a release started right after a merge
      # may arrive before they do.
      - name: Wait for the images of this commit
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in gooncave gooncave-tagger; do
            ref="ghcr.io/liukscot/$image:$SHA"
            for attempt in $(seq 1 45); do
              if docker manifest inspect "$ref" > /dev/null 2>&1; then
                continue 2
              fi
              sleep 20
            done
            echo "::error::$ref is not published. Check the Release workflow for this commit, then start this workflow again."
            exit 1
          done

      - name: Test the installer
        working-directory: packaging/installer
        run: go test ./...

      - name: Build the installer
        run: bash packaging/build.sh "$SHA"

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gooncave-pc
          path: dist/pc-installer/gooncave-install-linux-amd64
          if-no-files-found: error

  ios:
    name: Build the iPhone app
    needs: plan
    if: needs.plan.outputs.ios_new != ''
    uses: ./.github/workflows/ios-app.yml
    with:
      version: ${{ needs.plan.outputs.ios_new }}
      ref: ${{ needs.plan.outputs.sha }}

  draft:
    name: Draft the release
    needs: [plan, pc, ios]
    if: always() && needs.plan.outputs.release_tag != '' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      PC_NEW: ${{ needs.plan.outputs.pc_new }}
      PC_PREVIOUS: ${{ needs.plan.outputs.pc_previous }}
      IOS_NEW: ${{ needs.plan.outputs.ios_new }}
      IOS_PREVIOUS: ${{ needs.plan.outputs.ios_previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Download the installer built by this run
        if: needs.plan.outputs.pc_new != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gooncave-pc
          path: files

      - name: Download the IPA built by this run
        if: needs.plan.outputs.ios_new != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gooncave-iphone
          path: ipa-artifact

      # A platform with nothing new keeps its file from the latest published
      # release, which carries every platform's file.
      - name: Gather the file of every platform
        run: |
          mkdir -p files
          if [[ -n "$IOS_NEW" ]]; then
            mv "ipa-artifact/GoonCave-$IOS_NEW-ios.ipa" files/
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'GoonCave-*-ios.ipa' --dir files
          fi
          if [[ -z "$PC_NEW" ]]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern gooncave-install-linux-amd64 --dir files
          fi
          ls -l files

      - name: Create the draft release
        run: |
          ipa=$(basename files/GoonCave-*-ios.ipa)
          ios_current="${ipa#GoonCave-}"
          ios_current="${ios_current%-ios.ipa}"
          pc_current="${PC_NEW:-${PC_PREVIOUS#pc/v}}"
          {
            cat <<EOF
          ## Downloads

          - \`gooncave-install-linux-amd64\` — PC $pc_current, Linux x86-64 installer. Docker Engine with the Compose plugin must be installed and running.
          - \`$ipa\` — iPhone $ios_current. Requires iOS 26 or later and a GoonCave server; install it with your signing app.

          To update the PC installation, stop GoonCave, back up its \`data\` folder, uninstall while keeping data, then run the new installer. See [the installer guide](https://github.com/$GITHUB_REPOSITORY/blob/main/packaging/README.md).
          EOF
          } > notes.md
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$SHA" \
            --title "GoonCave — PC $pc_current, iPhone $ios_current" \
            --notes-file notes.md \
            --generate-notes \
            files/gooncave-install-linux-amd64 "files/$ipa"

      # The platform tags are what the next run counts from. They are pushed
      # last, so a run that fails earlier leaves nothing behind.
      - name: Tag the released versions
        run: |
          for tag in ${PC_NEW:+pc/v$PC_NEW} ${IOS_NEW:+ios/v$IOS_NEW}; do
            git tag "$tag" "$SHA"
            git push origin "$tag"
            echo "Tagged $tag."
          done
