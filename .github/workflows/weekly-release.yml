name: Weekly release

# Builds every supported platform at one version and commit. Only the owner
# publishes the draft. Started by the owner's weekly agent or by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared version, like 1.3.0. Empty picks it from merged pull requests.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  plan:
    name: Pick the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      FORCED: ${{ inputs.version }}
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pick the shared version
        id: version
        run: bash .github/scripts/release-version.sh

  desktop:
    name: Build the desktop app
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  ios:
    name: Build the iPhone app
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  draft:
    name: Draft the release
    needs: [plan, desktop, ios]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Flatpak built by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gooncave-desktop
          path: files

      - name: Download the IPA built by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gooncave-iphone
          path: files

      - name: Create the draft release
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$SHA" \
            --title "GoonCave $VERSION" \
            --notes "" \
            "files/GoonCave-linux-x86_64.flatpak" \
            "files/GoonCave-iphone.ipa"

      # A draft may not create its Git ref until publication. Reserve the version
      # only after both assets were attached successfully.
      - name: Tag the release commit
        run: |
          git tag "$RELEASE_TAG" "$SHA"
          git push origin "$RELEASE_TAG"
