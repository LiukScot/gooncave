[package]
name = "gooncave-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
httpdate = "1"
infer = "0.22"
kamadak-exif = "0.6"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "time", "fs"] }
tower-http = { version = "0.7", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "multipart"] }
csv = "1"
flate2 = "1"
tempfile = "3"
base64 = "0.22"
quick-xml = "0.42"
scraper = "0.27"
ring = "0.17"
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
