[package]
name = "gooncave-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
httpdate = "1"
infer = "0.22"
kamadak-exif = "0.6"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "time", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
tempfile = "3"
