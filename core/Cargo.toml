[package]
name = "gooncave-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
httpdate = "1"
infer = "0.22"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "time", "fs", "io-util"] }
tower-http = { version = "0.7", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "multipart", "stream"] }
csv = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tempfile = "3"
base64 = "0.23"
quick-xml = "0.42"
scraper = "0.27"
ring = "0.17"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-30"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
notify = { version = "8", default-features = false }

# Without a backend feature notify does not build on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[build-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
