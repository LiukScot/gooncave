# Builds the desktop app inside the GNOME SDK: Electron draws the window, and the core
# process (desktop/shell) serves the app and the library.
# Build the frontend first (npm --prefix frontend run build): the core embeds frontend/dist.
id: app.gooncave.desktop
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gooncave
finish-args:
  - --share=ipc
  # Booru searches, media, tag vocabulary and the WD14 model download.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The library folder of earlier versions, moved into the data folder on first start.
  - --filesystem=xdg-pictures/gooncave:create
  # Where downloads such as backup exports are saved.
  - --filesystem=xdg-download
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  # Runs Chromium's sandbox inside Flatpak's, which forbids the setuid helper Electron ships.
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53

  - name: electron
    buildsystem: simple
    build-commands:
      - rm chrome-sandbox
      - mkdir -p /app/lib/electron
      - cp -a . /app/lib/electron/
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v44.9.3/electron-v44.9.3-linux-x64.zip
        sha256: 6e7fd2d450d442507b846ace4ae6e2bd17e1b1653e86a033b5231abfc23e6df4
        strip-components: 0

  - name: gooncave
    buildsystem: simple
    build-options:
      # Cargo downloads crates and the build script downloads the pinned ONNX Runtime SDK.
      build-args:
        - --share=network
        # Survives between builds, so a rebuild compiles only GoonCave's own crates.
        - --filesystem=~/.cache/gooncave-flatpak-cargo:create
    build-commands:
      - |
        set -e
        export CARGO_HOME="$HOME/.cache/gooncave-flatpak-cargo/home"
        export CARGO_TARGET_DIR="$HOME/.cache/gooncave-flatpak-cargo/target"
        # Cargo compares file dates, and these sources are a fresh copy: never trust an older build of our crates.
        cargo clean --release --locked -p gooncave-core -p gooncave-desktop
        cargo build --release --locked -p gooncave-desktop
        install -Dm755 "$CARGO_TARGET_DIR/release/gooncave-desktop" /app/lib/gooncave/gooncave-desktop
      - install -Dm644 -t /app/lib/gooncave/electron desktop/electron/package.json desktop/electron/main.js desktop/electron/browser.js desktop/electron/links.js
      - install -Dm644 desktop/icons/app-icon-512.png /app/lib/gooncave/icons/app-icon-512.png
      - install -Dm755 desktop/flatpak/gooncave.sh /app/bin/gooncave
      - install -Dm644 desktop/flatpak/app.gooncave.desktop.desktop /app/share/applications/app.gooncave.desktop.desktop
      - install -Dm644 desktop/flatpak/app.gooncave.desktop.metainfo.xml /app/share/metainfo/app.gooncave.desktop.metainfo.xml
      - install -Dm644 desktop/icons/app-icon-512.png /app/share/icons/hicolor/512x512/apps/app.gooncave.desktop.png
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .claude
          - .flatpak-builder
          - target
          - node_modules
          - frontend/node_modules
          - desktop/electron/node_modules
          # The iPhone crate is a workspace member, so its manifest stays; its generated files do not.
          - ios/node_modules
          - ios/src-tauri/gen
          - ios/src-tauri/icons
          - storage
          - flatpak-build
          - flatpak-repo
