[package]
name = "gooncave-desktop"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gooncave-core = { path = "../../core" }
gtk4 = { version = "0.9", features = ["v4_10"] }
include_dir = "0.7"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
mime_guess = "2"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
webkit6 = { version = "0.4", features = ["v2_44"] }
