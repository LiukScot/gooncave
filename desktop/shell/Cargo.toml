[package]
name = "gooncave-desktop"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gooncave-core = { path = "../../core" }
gtk4 = { version = "0.9", features = ["v4_10"] }
include_dir = "0.7"
mime_guess = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
webkit6 = { version = "0.4", features = ["v2_44"] }
