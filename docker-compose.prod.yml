# Production stack. Runs the images published by .github/workflows/release.yml
# instead of building locally, so the server needs only this file and a .env —
# no git checkout, no build toolchain.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# To add host media folders, keep using docker-compose.override.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.override.yml up -d
#
# Updates are handled by Watchtower (see docker-compose.watchtower.yml).
services:
  api:
    image: ghcr.io/liukscot/gooncave:latest
    pull_policy: always
    container_name: gooncave-api
    restart: unless-stopped
    user: '${UID:-1000}:${GID:-1000}'
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      NODE_ENV: production
      # Defaults to the current deployment's value. Override in .env if the app
      # is ever reached over a public hostname instead of the host port.
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:4100}'
      # Must stay false while the app is served over plain HTTP: browsers drop
      # Secure cookies on http://, which silently breaks sign-in. Set it to true
      # in .env once an HTTPS reverse proxy terminates in front of the api.
      AUTH_COOKIE_SECURE: '${AUTH_COOKIE_SECURE:-false}'
      TAGGER_URL: http://tagger:8000
      TAGGER_SECRET: '${TAGGER_SECRET:-}'
      FOLDER_PATHS:
    volumes:
      - ./backend/storage:/app/storage
      - gooncave-library-data:/gooncave-library
    ports:
      - '4100:4100'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "require('http').get('http://localhost:4100/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/liukscot/gooncave:latest
    pull_policy: always
    container_name: gooncave-worker
    restart: unless-stopped
    user: '${UID:-1000}:${GID:-1000}'
    depends_on:
      api:
        condition: service_healthy
      tagger:
        condition: service_healthy
    command: ['bun', 'dist/startWorker.js']
    environment:
      HOST: 0.0.0.0
      PORT: 4100
      NODE_ENV: production
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:4100}'
      TAGGER_URL: http://tagger:8000
      TAGGER_SECRET: '${TAGGER_SECRET:-}'
      LOCAL_RESCAN_INTERVAL_MINUTES: 0
      FOLDER_PATHS:
    volumes:
      - ./backend/storage:/app/storage
      - gooncave-library-data:/gooncave-library
    labels:
      # compose `depends_on` only orders `up`, not Watchtower's restarts. This
      # tells Watchtower to cycle the worker together with the api.
      com.centurylinklabs.watchtower.depends-on: 'gooncave-api'
    healthcheck:
      disable: true

  tagger:
    image: ghcr.io/liukscot/gooncave-tagger:latest
    pull_policy: always
    container_name: gooncave-tagger
    restart: unless-stopped
    environment:
      WD14_REPO: SmilingWolf/wd-vit-tagger-v3
      TAGGER_SECRET: '${TAGGER_SECRET:-}'
      OMP_NUM_THREADS: '2'
      OMP_WAIT_POLICY: PASSIVE
      MALLOC_ARENA_MAX: '2'
      MALLOC_TRIM_THRESHOLD_: '131072'
      MALLOC_MMAP_THRESHOLD_: '131072'
      WD14_THRESHOLD_GENERAL: 0.35
      WD14_THRESHOLD_ARTIST: 0.5
      WD14_THRESHOLD_CHARACTER: 0.5
      WD14_THRESHOLD_COPYRIGHT: 0.5
      WD14_THRESHOLD_META: 0.5
    volumes:
      # Named volume, so a model re-download is not needed after every update.
      - tagger-cache:/app/hf-cache
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

volumes:
  gooncave-library-data:
  tagger-cache:
