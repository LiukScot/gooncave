# One Watchtower for the whole server. It polls GHCR and restarts every
# container labelled com.centurylinklabs.watchtower.enable=true, across all
# stacks — so start it ONCE:
#
#   docker compose -f docker-compose.watchtower.yml up -d
#
# This file is identical in the world repo. `container_name` makes a second
# copy fail loudly instead of quietly double-pulling.
#
# Image note: the original containrrr/watchtower is archived and unmaintained;
# nickfedor/watchtower is the actively maintained fork and a drop-in
# replacement (same labels, same env vars).
services:
  watchtower:
    image: nickfedor/watchtower:1.21.0
    container_name: watchtower
    restart: unless-stopped
    volumes:
      # Read-write is required: Watchtower has to recreate containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only touch containers that opted in with the label. Without this it
      # would try to update every container on the host.
      WATCHTOWER_LABEL_ENABLE: 'true'
      # Delete the image it just replaced, otherwise the disk fills up.
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_POLL_INTERVAL: '${WATCHTOWER_POLL_INTERVAL:-300}'
    labels:
      # Watchtower keeps itself up to date too.
      com.centurylinklabs.watchtower.enable: 'true'
