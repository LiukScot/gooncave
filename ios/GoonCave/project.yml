name: GoonCave
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GoonCave:
    type: application
    platform: iOS
    sources: [App]
    scheme:
      testTargets: [GoonCaveTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gooncave
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GoonCave
        # Development values. A release build takes its version from the
        # release workflow (see .github/workflows/weekly-release.yml).
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: GoonCave connects to your server when it runs on your home network.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  GoonCaveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GoonCave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gooncave.tests
        GENERATE_INFOPLIST_FILE: "YES"
