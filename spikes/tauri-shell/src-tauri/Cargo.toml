[package]
name = "gooncave-shell-spike"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
# The iOS build links the static library; desktop links the rlib.
name = "gooncave_shell_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "ios")'.dependencies]
# Tauri has no setting for iOS back/forward swipes, so the spike turns them on
# directly on the WKWebView, as the current iPhone app does in Swift.
objc2 = "0.6"
